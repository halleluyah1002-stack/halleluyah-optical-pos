services:
  - type: web
    name: visioncare-eye-clinic-pos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visioncare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: visioncare-db
    databaseName: visioncare
    user: visioncare
